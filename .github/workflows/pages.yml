name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # enablement:true turns GitHub Pages on via the API, so the site does not
      # depend on anyone flipping the switch in Settings -> Pages by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Rebuild from data/*.json so adding a day only means committing one JSON file.
      - name: Build site
        run: python3 build_site.py data _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
